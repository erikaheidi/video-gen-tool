[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explainer"
version = "0.1.0"
description = "Generate short slideshow-style explainer videos for social media from YAML scripts"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "pillow>=10",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
explainer = "explainer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
explainer = ["templates/*.yaml", "patterns/*.yaml", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
